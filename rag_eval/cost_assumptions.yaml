# Every number the cost model uses. Prices are USD, us-east-1, checked 2026-11-25.
# Change a value here and re-run `python -m rag_eval.cost_model`; nothing is hard-coded elsewhere.

workload:
  scales: [100000, 1000000, 10000000]     # vectors
  dim: 384                                 # bge-small-en-v1.5
  bytes_per_float: 4
  text_and_metadata_bytes: 1650            # measured mean chunk text (~355 tokens) + metadata in our table, rounded
  queries_per_month: 100000                # "large but lightly queried": ~2.3 queries/minute
  monthly_churn_fraction: 0.10             # share of records re-written each month
  sensitivity_queries_per_month: [100000, 1000000, 10000000]

lancedb_serverless:                        # LanceDB OSS, data on S3, query compute in a function (scales to zero)
  s3_storage_per_gb_month: 0.023           # S3 Standard, first 50 TB
  storage_overhead: 1.3                    # IVF-PQ index + table versions kept before compaction
  s3_get_per_1000: 0.0004
  gets_per_query: 40                       # nprobes=20 partition reads + refine reads; LanceDB coalesces ranges
  s3_put_per_1000: 0.005
  puts_per_1000_records_written: 2         # batched fragment writes
  function_gb: 1.769                       # Lambda arm64 at 1 vCPU
  function_seconds_per_query: 0.35         # embed (~15 ms) + IVF-PQ over S3 (~150-300 ms)
  function_price_per_gb_second: 0.0000133334
  function_price_per_million_requests: 0.20

lancedb_vm:                                # LanceDB OSS on one always-on VM with EBS gp3 (no HA)
  ebs_gp3_per_gb_month: 0.08
  ebs_min_gb: 20
  instances:                               # on-demand, Linux; chosen so IVF-PQ codes + hot partitions fit in RAM
    100000: {type: t4g.small, ram_gb: 2, per_hour: 0.0168}
    1000000: {type: t4g.medium, ram_gb: 4, per_hour: 0.0336}
    10000000: {type: t4g.large, ram_gb: 8, per_hour: 0.0672}
  hours_per_month: 730

pinecone_serverless:                       # https://www.pinecone.io/pricing/ (Standard plan, "Updated November 2026")
  storage_per_gb_month: 0.33
  read_units_per_million: 16.0             # low end of $16-$18 (varies by cloud/region)
  write_units_per_million: 4.0             # low end of $4-$4.50
  min_read_units_per_query: 0.25           # 1 RU per GB of namespace searched, minimum 0.25
  write_units_per_kb: 1                    # 1 WU per KB written
  monthly_minimum: 50.0

qdrant_cloud:                              # https://cloud.qdrant.io/calculator, AWS us-east-1, 384-d, no quantization, replication 1
  monthly_by_scale:                        # read off the calculator 2026-11-25; RAM-provisioned, billed hourly whether queried or not
    100000: 26.10                          # 2 GiB / 0.5 vCPU, 1 node
    1000000: 34.17                         # 1 node, 3 GiB required
    10000000: 205.02                       # 8 GiB x 3 nodes
