[project]
name = "applied-ai-takehome"
version = "0.1.0"
description = "Cost-efficient RAG on LanceDB and a bias-aware LLM-as-judge pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "lancedb>=0.17",
    "pyarrow>=16",
    "fastembed>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pypdf>=4.2",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "faiss-cpu>=1.8",
    "matplotlib>=3.8",
    "rich>=13",
    "python-docx>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
