    url: https://en.wikipedia.org/api/rest_v1/page/html/Okapi_BM25/1383710681
  - id: wiki-dcg
    type: html
    title: "Discounted cumulative gain"
    url: https://en.wikipedia.org/api/rest_v1/page/html/Discounted_cumulative_gain/1383184584
  - id: wiki-mrr
